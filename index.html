<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="description" content="SMRITI: an offline active-recall system for UPSC CSE and CAPF AC.">
  <meta name="theme-color" content="#1d4f91" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#18202a" media="(prefers-color-scheme: dark)">
  <title>SMRITI</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="stylesheet" href="app.css">
  <script>
    // Apply the saved theme before first paint (a UI preference, so localStorage).
    try { var t = localStorage.getItem('smriti.theme'); if (t) document.documentElement.dataset.theme = t; } catch (e) {}
  </script>
  <script type="module" src="js/app.js"></script>
</head>
<body>
  <header class="topbar">
    <span class="brand">SMRITI</span>
    <h1 id="view-title">Library</h1>
    <span id="net" class="pill" hidden></span>
  </header>
  <div id="banners" aria-live="polite"></div>
  <main id="view" tabindex="-1">
    <p class="muted">Loading…</p>
  </main>
  <nav id="nav" class="bottomnav" aria-label="Main"></nav>
  <div id="sheet-root"></div>
  <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
  <noscript><p>SMRITI needs JavaScript.</p></noscript>
</body>
</html>
